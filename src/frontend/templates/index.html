<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The crazy party game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>

<body>
    <header class="page-header">
        <h1>The crazy party game</h1>
        <h4>Réunis tes amis, crée ton lobby et lance une soirée folle.</h4>
    </header>

    <main>
        <section class="hero-card">
            <div class="hero-card__content">
                <div class="hero-card__title">
                    <span>Ready to play?</span>
                </div>
                <p>Entrez votre pseudo et rejoignez un lobby pour démarrer une session pleine de défis et de rires.</p>
                <form class="form">
                    <div class="player-controls">
                        <label for="player-name">Ton nom</label>
                        <input type="text" id="player-name" name="player-name" required placeholder="Crazy name" maxlength="11">
                    </div>

                    <div class="player-controls">
                        <label for="lobby-id">Code du lobby</label>
                        <input type="text" id="lobby-id" name="lobby-id" placeholder="Optionnel pour créer un lobby">
                    </div>

                    <div class="lobby-controls">
                        <button type="button" id="create-lobby" class="primary-btn">Créer un lobby</button>
                        <button type="button" id="join-lobby" class="secondary-btn">Rejoindre</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/server.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
