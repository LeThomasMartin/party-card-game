<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The crazy party game - Création de cartes</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/animations.css') }}">
</head>
<body data-lobby-id="{{ lobby_id }}">
    <h1>The crazy party game - Création de cartes</h1>
    <main>
        <section class="card-creation-screen">
            <div class="page-header">
                <div class="header-badge">Création de cartes</div>
                <h1>Crée tes 5 cartes</h1>
                <p class="creation-subtitle">Une carte par catégorie. Écris directement dans la carte et passe à la suivante.</p>
            </div>

            <div class="card-creation-panel">
                <div class="card-creation-status">
                    <div class="step-label">Carte <strong id="step-number">1</strong> / 5</div>
                    <div class="step-dots" id="step-dots"></div>
                </div>

                <div class="card-creation-card category-boisson" id="card-editor">
                    <div class="card-category card-category--large" id="card-category-label">BOISSON</div>
                    <div class="card-editor-frame">
                        <textarea id="card-text-input" class="card-editor-textarea" rows="8" placeholder="Écris ici le texte de ta carte..."></textarea>
                    </div>
                </div>

                <button type="button" id="next-card-button" class="primary-btn">Suivant</button>
                <p class="completion-message" id="completion-message" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/card-creation.js') }}"></script>
</body>
</html>
